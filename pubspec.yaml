name: fechamento_caixa
description: "Aplicativo de fechamento de caixa desenvolvido utilizando Flutter"

publish_to: 'none' # Remove this line if you wish to publish to pub.dev


version: 1.0.0+1

environment:
  sdk: ^3.13.5


dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  intl: ^0.20.3
  firebase_core: ^4.15.0
  cloud_firestore: ^6.10.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0


flutter:
  assets:
    - assets/home_screen/novo_fechamento.png
    - assets/home_screen/historico_relatorios.png
    - assets/home_screen/relatorios.png
    - assets/home_screen/usuario.png
    - assets/home_screen/caixa-registradora.png
    - assets/home_screen/botao-de-inicio.png
    - assets/home_screen/relatorio.png
    - assets/home_screen/mais.png
    
    - assets/novo_fechamento/seta-para-esquerda.png




  uses-material-design: true

