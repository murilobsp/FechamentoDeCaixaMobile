name: fechamento_caixa
description: "Aplicativo de fechamento de caixa desenvolvido utilizando Flutter"

publish_to: 'none' # Remove this line if you wish to publish to pub.dev


version: 1.0.0+1

environment:
  sdk: ^3.13.5


dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  intl: ^0.20.3
  firebase_core: ^4.15.0
  cloud_firestore: ^6.10.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0


flutter:
  assets:
      #IMAGENS HOME SCREEN
    - assets/home_screen/


      #IMAGENS DRAWER
    - assets/drawer/


    

      #IMAGENS NOVO FECHAMENTO
    - assets/novo_fechamento/seta-para-esquerda.png
    - assets/novo_fechamento/notas.png
    - assets/novo_fechamento/setaBaixo.png
    - assets/novo_fechamento/restos.png
    - assets/novo_fechamento/cifrao.png



    #IMAGENS RELATORIO DO CAIXA

    - assets/relatorio_caixa/dinheiro.png
    - assets/relatorio_caixa/cartaocredito.png
    - assets/relatorio_caixa/cartaodebito.png
    - assets/relatorio_caixa/entrada.png
    - assets/relatorio_caixa/saida.png




  uses-material-design: true

  # To add assets to your application, add an assets section, like this:
